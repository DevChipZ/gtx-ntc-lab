name: NTC Prototype CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run quick benchmark smoke test
        run: python prototype/ntc_bench.py --size 64 --steps 25 --hidden-dim 16
      - name: Run VRAM budget planner check
        run: python prototype/vram_budget.py
      - name: Run 4-channel bundle smoke test
        run: python prototype/bundle_bench.py --size 64 --steps 25 --hidden-dim 16
      - name: Run DDS export smoke test
        run: python prototype/dds_export.py --size 64 --out test_out.dds
      - name: Run NTC-to-DDS pipeline smoke test
        run: PYTHONPATH=prototype python prototype/ntc_to_dds.py --size 64 --steps 25 --hidden-dim 16 --out ntc_test.dds

      - name: Run batch NTC + VRAM budget smoke test
        run: PYTHONPATH=prototype python prototype/batch_bench.py --size 128 --grid-size 32 --steps 20 --vram-cap-mb 3500
